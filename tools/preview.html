<!doctype html>
<meta charset="utf-8">
<!-- Home Assistant's frontend sets this, so the preview must too. Without it a
     phone lays the page out at 980px and scales it down, which hides every
     narrow-viewport problem the card has and invents a few it does not. -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>myHealth Dashboard — preview</title>
<!--
  Renders the built card against a real states dump, outside Home Assistant.

  It fakes exactly as much `hass` as the card touches: `states` as an object
  keyed by entity id (which is the shape HA passes, unlike the array
  /api/states returns), and `callWS` answering the one statistics query the
  freshness layer makes. Everything else is the shipped file.

    python3 -m http.server 8777 --directory tools
    open http://localhost:8777/preview.html

  Add ?tab=body to land on another view, or ?dark=1 to force the dark palette.
-->
<style>
  html, body { margin: 0; background: #f2f5f4; }
  #err { font: 14px ui-monospace, monospace; color: #a02940; padding: 20px; white-space: pre-wrap; }
</style>
<div id="err" hidden></div>
<script src="../dist/myhealth-dashboard.js"></script>
<script>
(async () => {
  const fail = (e) => {
    const box = document.getElementById("err");
    box.hidden = false;
    box.textContent = "preview failed:\n" + (e && e.stack || e);
  };
  try {
    const q = new URLSearchParams(location.search);
    const [statesArr, stats, series] = await Promise.all([
      fetch("states.json").then((r) => r.json()),
      fetch("stats.json").then((r) => r.json()).catch(() => ({})),
      fetch("series.json").then((r) => r.json()).catch(() => ({}))
    ]);

    /* ?only=withings keeps only entities whose id matches, which is how the
       standalone rule gets looked at rather than merely asserted: a user with
       one scale and nothing else should get a page that degrades, not one
       that breaks. */
    const only = q.get("only");
    const states = {};
    for (const e of statesArr) {
      if (only && e.entity_id.indexOf(only) < 0) continue;
      states[e.entity_id] = e;
    }

    const hass = {
      states,
      /* Ask the coach is the one thing on the page that writes. The preview
         must not call a real script, but it must not be missing either — a
         `callService` that is simply undefined turns the Ask button into a
         TypeError, which is a worse lie than a stub. This one answers the way
         the real coach does: by replacing the retained message a moment later. */
      callService: async (domain, service, data) => {
        console.log("callService", domain, service, data);
        await new Promise((r) => setTimeout(r, 600));
        const id = "sensor.stride_coach";
        if (!states[id]) return;
        const next = Object.assign({}, states, {
          [id]: Object.assign({}, states[id], {
            state: "A preview answer",
            attributes: Object.assign({}, states[id].attributes, {
              headline: "A preview answer",
              body: "This is tools/preview.html, so nothing was asked of the "
                  + "real coach. On the instance the reply lands here.",
              kind: "question", source: "preview"
            })
          })
        });
        Object.assign(states, next);
        card.hass = Object.assign({}, hass, { states: Object.assign({}, states) });
      },

      callWS: async (msg) => {
        if (msg.type !== "recorder/statistics_during_period") return {};
        const out = {};
        for (const id of msg.statistic_ids || []) {
          /* Chart queries are keyed by exactly what the view asked for, so the
             preview answers the query that was made rather than the one it
             guessed. The freshness pass (hourly means over every entity) falls
             back to the flat stats.json dump. */
          const key = id + "|" + msg.period + "|" + (msg.types || []).join(",");
          if (series[key]) out[id] = series[key];
          else if (stats[id]) out[id] = stats[id];
        }
        return out;
      }
    };

    const card = document.createElement("myhealth-dashboard");
    /* ?box=390 constrains the card without narrowing the viewport, which is
       the case the media queries cannot see: in the Home Assistant companion
       app the card was laid out side by side and clipped while the viewport
       apparently reported something much wider. If the layout only collapses
       when a media query fires, it fails here — and this is the case that
       matters on a phone. */
    if (q.get("box")) {
      card.style.maxWidth = q.get("box") + "px";
      card.style.display = "block";
      card.style.overflow = "hidden";
      card.style.outline = "2px dashed #c0334d";
    }
    card.setConfig({ type: "custom:myhealth-dashboard", tab: q.get("tab") || "today" });
    if (q.get("dark")) card.setAttribute("data-theme", "dark");
    document.body.appendChild(card);
    card.hass = hass;

    /* The statistics pass is async; give it a moment, then mark the page ready
       so a screenshot waits for the real ages rather than the first paint. */
    setTimeout(() => { document.title = "ready"; }, 900);

    /* ?measure=1 names whatever is making the page wider than the viewport.
       Guessing at this from a screenshot is how an afternoon disappears: the
       symptom is that *everything* is clipped, which points at every element
       equally and at none of them in particular. */
    if (q.get("measure")) {
      setTimeout(() => {
        const vw = document.documentElement.clientWidth;
        const bad = [];
        const walk = (root) => {
          for (const n of root.querySelectorAll("*")) {
            const r = n.getBoundingClientRect();
            if (r.right > vw + 1 || r.width > vw + 1) {
              bad.push(`${n.tagName.toLowerCase()}.${(n.className || "").toString().split(" ")[0]}` +
                       `  w=${Math.round(r.width)}  right=${Math.round(r.right)}`);
            }
            if (n.shadowRoot) walk(n.shadowRoot);
          }
        };
        walk(document);
        if (card.shadowRoot) walk(card.shadowRoot);
        const box = document.getElementById("err");
        box.hidden = false;
        box.style.color = bad.length ? "#a02940" : "#0f6d52";
        box.textContent = `viewport ${vw}px · document scrollWidth ` +
          `${document.documentElement.scrollWidth}px\n` +
          (bad.length ? bad.slice(0, 14).join("\n") : "nothing overflows");
      }, 1400);
    }

    /* ?churn=N re-sets hass N times with an unrelated entity changing, which
       is what a busy instance does all day. It exists because the charts once
       re-ran their draw-in animation on every one of those, and counting the
       SVG paths actually rebuilt is the only honest way to show they no
       longer do. */
    const churn = parseInt(q.get("churn") || "0", 10);
    if (churn > 0) {
      setTimeout(() => {
        let redraws = 0;
        new MutationObserver((recs) => {
          for (const r of recs) {
            for (const n of r.addedNodes) if (n.tagName === "path") redraws++;
          }
        }).observe(card.shadowRoot, { childList: true, subtree: true });

        const victim = Object.keys(states).find((k) => !/health|withings|treadmill|stride/.test(k));
        for (let i = 0; i < churn; i++) {
          const next = Object.assign({}, states);
          next[victim] = Object.assign({}, states[victim], { state: "churn" + i });
          card.hass = Object.assign({}, hass, { states: next });
        }
        setTimeout(() => {
          const box = document.getElementById("err");
          box.hidden = false;
          box.style.color = redraws ? "#a02940" : "#0f6d52";
          box.textContent = `churned hass ${churn}x with an unrelated entity → ` +
                            `${redraws} chart paths rebuilt` +
                            (redraws ? "  (charts are still redrawing)" : "  (no redraw)");
        }, 400);
      }, 1500);
    }
  } catch (e) { fail(e); }
})();
const surface = (what) => {
  const box = document.getElementById("err");
  box.hidden = false;
  box.textContent += "\n" + what;
};
window.addEventListener("error", (e) =>
  surface(e.message + "  @" + e.filename + ":" + e.lineno));
/* Views are updated inside a .then(), so anything they throw is an unhandled
   rejection rather than an error event — and would otherwise show up only as
   a chart that is silently empty. */
window.addEventListener("unhandledrejection", (e) =>
  surface("unhandled rejection: " + (e.reason && e.reason.stack || e.reason)));
</script>
